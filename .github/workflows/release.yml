name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Mage
        run: |
          go install github.com/magefile/mage@v1.17.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build backend
        run: mage -v buildAll

      - name: Test backend
        run: mage -v test

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@6
          -p @semantic-release/exec@7
          -p @semantic-release/git@10
          -p @semantic-release/github@12
          -p @semantic-release/npm@13
          -p @semantic-release/commit-analyzer@13
          -p @semantic-release/release-notes-generator@14
          semantic-release

  package-plugin:
    name: Build, sign, and package plugin release asset
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write
      contents: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Build and package plugin
        id: package-plugin
        uses: grafana/plugin-actions/package-plugin@main
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          go-version: '1.26'
          node-version: '22'

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.package-plugin.outputs.archive }}

      - name: Attach plugin to GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            ./${{ steps.package-plugin.outputs.archive }}
            ./${{ steps.package-plugin.outputs.archive-sha1sum }}

  package-plugin-variant:
    name: Build and package alternate plugin ID release asset
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write
      contents: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build alternate plugin ID asset
        id: package-plugin-variant
        run: npm run package:variant
        env:
          PLUGIN_VARIANT_ID: grafana-assistant-app

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.package-plugin-variant.outputs.archive }}

      - name: Attach alternate plugin ID asset to GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            ./${{ steps.package-plugin-variant.outputs.archive }}
            ./${{ steps.package-plugin-variant.outputs.archive-sha1sum }}
