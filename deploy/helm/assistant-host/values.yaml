image:
  repository: grafana-assistant-host
  tag: dev
  pullPolicy: IfNotPresent

# Two replicas: one leader (holds the Lease, connected, ready), one standby.
replicas: 2

grafana:
  # Grafana as the host reaches it.
  url: http://grafana:3000
  # Links people open; default: Grafana's appUrl.
  publicUrl: ''
  pluginId: grafana-assistant-app

# A Secret with the tokens: grafana-token and alert-webhook-token (required),
# mattermost-token and webex-token for the enabled platforms.
existingSecret: assistant-host

mattermost:
  url: ''
  # team/channel list where mentions are answered outside alert threads.
  channels: ''
  allowDirect: true

webex:
  # Messages arrive over Webex's websocket, outbound only. Behind an HTTP proxy, set
  # HTTPS_PROXY, NO_PROXY (Grafana, the Kubernetes API), and NODE_USE_ENV_PROXY=1 in `env`.
  enabled: false
  apiUrl: https://webexapis.com/v1
  # Room titles or IDs where mentions are answered outside alert threads.
  rooms: ''
  allowDirect: true

assistant:
  requireLink: false
  emailMatch: false
  concurrency: 2

lease:
  name: assistant-host

# Extra environment variables for the host.
env: []

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi

podDisruptionBudget:
  minAvailable: 1
