[tasks."dev:build:backend:docker"]
description = "Build the backend for the Docker engine's architecture."
hide = true
run = '''
docker_arch=$(docker info --format '{% raw %}{{.Architecture}}{% endraw %}')
case "$docker_arch" in
  amd64|x86_64) backend_arch=amd64 ;;
  arm64|aarch64) backend_arch=arm64 ;;
  *) echo "Unsupported Docker engine architecture: $docker_arch" >&2; exit 1 ;;
esac
npm run "backend:build:linux-$backend_arch"
'''

[tasks."dev:reload"]
description = "Rebuild frontend/backend plugin artifacts and start or reload the local Docker stack."
run = [
  "npm run build",
  "mise run dev:build:backend:docker",
  "docker compose up -d --build --remove-orphans",
  "docker compose restart grafana",
]

[tasks."dev:reload:variant"]
description = "Build the grafana-assistant-app variant and start or reload the local Docker stack on port 3001."
run = [
  "npm run build:variant",
  "GRAFANA_PLUGIN_ID=grafana-assistant-app mise run dev:build:backend:docker",
  "docker compose --profile assistant-variant up -d --build --remove-orphans grafana-assistant-variant",
  "docker compose restart grafana-assistant-variant",
]

[tasks."dev:seed:samples"]
description = "Seed stable local dashboards and alert rules for assistant manual testing."
run = "npm run dev:seed:samples"

[tasks."dev:reload:variant:seed"]
description = "Reload the sidebar-capable variant on port 3001 and seed stable manual-test samples."
run = [
  "mise run dev:reload:variant",
  "npm run dev:seed:samples",
]

[tasks."dev:reload:variant:fresh"]
description = "Reset Compose volumes, reseed Prometheus history, reload the sidebar variant, and seed samples."
run = [
  "docker compose --profile logs down -v --remove-orphans",
  "HISTORY_FUTURE_SECONDS=${HISTORY_FUTURE_SECONDS:-3600} mise run dev:reload:variant:seed",
]

[tasks."dev:reload:variant:logs"]
description = "Reload the sidebar-capable variant on port 3001 and reseed the Elasticsearch log fixture for the current Prometheus history."
run = [
  "mise run dev:reload:variant",
  "docker compose --profile logs run --rm -e LOGS_FORCE=1 elasticsearch-seed",
]

[tasks."dev:logs"]
description = "Start and seed the Elasticsearch restricted-log fixture (Compose profile `logs`) and check it through Grafana on port 3001."
run = [
  "docker compose --profile logs run --rm elasticsearch-seed",
  "npm run dev:check:logs",
]

[tasks."dev:logs:reseed"]
description = "Delete and regenerate the Elasticsearch log fixture, aligned with the current Prometheus history."
run = [
  "docker compose --profile logs run --rm -e LOGS_FORCE=1 elasticsearch-seed",
  "npm run dev:check:logs",
]

[tasks."generate:types"]
description = "Generate src/generated/api.ts from the Go resource route types in pkg/api."
run = [
  "go tool tygo generate",
  "npx prettier --write src/generated/api.ts",
]
