apiVersion: 1

apps:
  - type: '$__env{PI_PLUGIN_ID}'
    org_id: 1
    org_name: 'elohmeier'
    disabled: false
    jsonData:
      openAIBaseUrl: $__env{PI_OPENAI_BASE_URL}
      models:
        - id: $__env{PI_DEFAULT_MODEL}
          default: true
          protocol: $__env{PI_OPENAI_PROTOCOL}
          thinkingLevel: $__env{PI_THINKING_LEVEL}
          thinkingFormat: $__env{PI_THINKING_FORMAT}
          contextWindow: $__env{PI_CONTEXT_WINDOW}
          maxOutputTokens: $__env{PI_MAX_OUTPUT_TOKENS}
      accessMode: all
      allowedUsers: []
      systemPromptAddendum: ''
      isOpenAIAPIKeySet: true
      allowedPrometheusDatasourceUids: ['prometheus', 'thanos-prod-db']
      # Restricted log access to the `logs` Compose profile fixture (docs/restricted-logs.md).
      logDatasources:
        - uid: es-logs
          indices: ['logs-app-prod', 'logs-nginx.access-prod']
          unrestricted:
            - field: log.logger
              values: ['deployer']
      customSkills: []
    secureJsonData:
      openAIAPIKey: $__env{OPENAI_API_KEY}
