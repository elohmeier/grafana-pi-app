apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: $__env{PI_PROMETHEUS_URL}
    isDefault: true
    editable: true
    jsonData:
      # Matches the seeded history step (HISTORY_STEP_SECONDS, default 60) so
      # the rate interval spans at least two samples; live 5s scrapes still work.
      timeInterval: 60s
  - name: Thanos Prod
    uid: thanos-prod-db
    type: prometheus
    access: proxy
    url: $__env{PI_PROMETHEUS_URL}
    isDefault: false
    editable: true
    jsonData:
      # Matches the seeded history step (HISTORY_STEP_SECONDS, default 60) so
      # the rate interval spans at least two samples; live 5s scrapes still work.
      timeInterval: 60s
