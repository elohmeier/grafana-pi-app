exclude: |
  (?x)^(
    \.config/|
    node_modules/|
    dist/|
    artifacts/|
    work/|
    ci/|
    test-results/|
    playwright-report/|
    blob-report/|
    playwright/\.cache/|
    playwright/\.auth/|
    research/|
    pkg/plugin/jsonnet/vendor/
  )

repos:
  - repo: local
    hooks:
      - id: eslint-fix
        name: eslint --fix
        entry: npm exec -- eslint --cache --fix
        language: system
        files: \.[cm]?[jt]sx?$

      - id: prettier
        name: prettier
        entry: npm exec -- prettier --write --ignore-unknown
        language: system
        files: \.(css|html|json|jsx?|md|mdx|scss|tsx?|ya?ml)$

      - id: tygo
        name: tygo (src/generated/api.ts)
        entry: bash -c 'go tool tygo generate && npm exec -- prettier --write src/generated/api.ts >/dev/null'
        language: system
        files: ^(pkg/api/.*\.go|tygo\.yaml)$
        pass_filenames: false

      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run
        language: system
        types: [go]
        pass_filenames: false
