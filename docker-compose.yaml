services:
  history-generator:
    image: python:3.14-slim
    working_dir: /repo
    command:
      - python
      - demo/prometheus/generate_openmetrics.py
      - --output
      - /demo/history.openmetrics
      - --timeline-output
      - /demo/timeline.json
    environment:
      HISTORY_HOURS: '${HISTORY_HOURS:-6}'
      HISTORY_STEP_SECONDS: '${HISTORY_STEP_SECONDS:-60}'
      INCIDENT_DURATION_SECONDS: '${INCIDENT_DURATION_SECONDS:-900}'
      HISTORY_FUTURE_SECONDS: '${HISTORY_FUTURE_SECONDS:-0}'
    volumes:
      - .:/repo:ro
      - demo-data:/demo

  prometheus-init:
    image: prom/prometheus:v3.7.3
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if find /prometheus -mindepth 1 -maxdepth 1 | read; then
          echo "Prometheus data already exists; skipping historical import."
        else
          promtool tsdb create-blocks-from openmetrics /demo/history.openmetrics /prometheus
          # Kept with the imported history so the log fixture can align with it.
          cp /demo/timeline.json /prometheus/demo-timeline.json
        fi
    volumes:
      - demo-data:/demo:ro
      - prometheus-data:/prometheus
    depends_on:
      history-generator:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=12h'
      - '--web.enable-lifecycle'
    volumes:
      - ./demo/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      prometheus-init:
        condition: service_completed_successfully

  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    container_name: 'g42-pi-app'
    build:
      args:
        grafana_version: ${GRAFANA_VERSION:-13.2.1}
    depends_on:
      prometheus:
        condition: service_started
      renderer:
        condition: service_started
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ${PI_PLUGIN_PROVISIONING_FILE:-./provisioning/plugins/app.yaml}:/etc/grafana/provisioning/plugins/app.yaml:ro
    environment:
      PI_PLUGIN_ID: g42-pi-app
      GF_LOG_FILTERS: plugin.g42-pi-app:debug
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: g42-pi-app
      GF_FEATURE_TOGGLES_ENABLE: externalServiceAccounts
      GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED: 'true'
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-dev-key}
      PI_OPENAI_BASE_URL: ${PI_OPENAI_BASE_URL:-http://host.docker.internal:8080/v1}
      PI_OPENAI_PROTOCOL: ${PI_OPENAI_PROTOCOL:-auto}
      PI_DEFAULT_MODEL: ${PI_DEFAULT_MODEL:-ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q4_K_M}
      PI_THINKING_LEVEL: ${PI_THINKING_LEVEL:-medium}
      PI_THINKING_FORMAT: ${PI_THINKING_FORMAT:-qwen-chat-template}
      PI_CONTEXT_WINDOW: ${PI_CONTEXT_WINDOW:-131072}
      PI_MAX_OUTPUT_TOKENS: ${PI_MAX_OUTPUT_TOKENS:-16384}
      PI_PROMETHEUS_URL: ${PI_PROMETHEUS_URL:-http://prometheus:9090}
      PI_ELASTICSEARCH_URL: ${PI_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      PI_ELASTICSEARCH_PASSWORD: ${PI_ELASTICSEARCH_PASSWORD:-grafana-dev}
      PI_MSSQL_URL: ${PI_MSSQL_URL:-mssql:1433}
      PI_MSSQL_PASSWORD: ${PI_MSSQL_PASSWORD:-Grafana-dev1}

  grafana-assistant-variant:
    profiles:
      - assistant-variant
    user: root
    container_name: 'grafana-assistant-app'
    build:
      context: .config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-13.2.1}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - '3001:3000/tcp'
      - '2346:2345/tcp'
    security_opt:
      - 'apparmor:unconfined'
      - 'seccomp:unconfined'
    cap_add:
      - SYS_PTRACE
    depends_on:
      prometheus:
        condition: service_started
      renderer:
        condition: service_started
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./dist:/var/lib/grafana/plugins/grafana-assistant-app
      - ./provisioning:/etc/grafana/provisioning
      - ${PI_PLUGIN_PROVISIONING_FILE:-./provisioning/plugins/app.yaml}:/etc/grafana/provisioning/plugins/app.yaml:ro
      - .:/root/elohmeier-grafanapiapp-app
    environment:
      NODE_ENV: development
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      PI_PLUGIN_ID: grafana-assistant-app
      GF_LOG_FILTERS: plugin.grafana-assistant-app:debug
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-assistant-app
      GF_FEATURE_TOGGLES_ENABLE: externalServiceAccounts restrictedPluginApis
      GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED: 'true'
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana-assistant-variant:3000/
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-dev-key}
      PI_OPENAI_BASE_URL: ${PI_OPENAI_BASE_URL:-http://host.docker.internal:8080/v1}
      PI_OPENAI_PROTOCOL: ${PI_OPENAI_PROTOCOL:-auto}
      PI_DEFAULT_MODEL: ${PI_DEFAULT_MODEL:-ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q4_K_M}
      PI_THINKING_LEVEL: ${PI_THINKING_LEVEL:-medium}
      PI_THINKING_FORMAT: ${PI_THINKING_FORMAT:-qwen-chat-template}
      PI_CONTEXT_WINDOW: ${PI_CONTEXT_WINDOW:-131072}
      PI_MAX_OUTPUT_TOKENS: ${PI_MAX_OUTPUT_TOKENS:-16384}
      PI_PROMETHEUS_URL: ${PI_PROMETHEUS_URL:-http://prometheus:9090}
      PI_ELASTICSEARCH_URL: ${PI_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      PI_ELASTICSEARCH_PASSWORD: ${PI_ELASTICSEARCH_PASSWORD:-grafana-dev}
      PI_MSSQL_URL: ${PI_MSSQL_URL:-mssql:1433}
      PI_MSSQL_PASSWORD: ${PI_MSSQL_PASSWORD:-Grafana-dev1}

  # Restricted log access fixture (profile `logs`): synthetic ECS logs aligned
  # with the Prometheus demo incident. See docs/restricted-logs.md.
  elasticsearch:
    profiles:
      - logs
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-9.5.3}
    environment:
      discovery.type: single-node
      xpack.license.self_generated.type: basic
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      ingest.geoip.downloader.enabled: 'false'
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic-dev}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - '${ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -u "elastic:$$ELASTIC_PASSWORD" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  elasticsearch-seed:
    profiles:
      - logs
    image: python:3.14-slim
    working_dir: /repo
    command: ['python', 'demo/elasticsearch/seed_logs.py']
    environment:
      ES_URL: http://elasticsearch:9200
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic-dev}
      GRAFANA_ES_PASSWORD: ${PI_ELASTICSEARCH_PASSWORD:-grafana-dev}
      TIMELINE_FILE: /prometheus-history/demo-timeline.json
      HISTORY_HOURS: '${HISTORY_HOURS:-6}'
      INCIDENT_DURATION_SECONDS: '${INCIDENT_DURATION_SECONDS:-900}'
      LOGS_SEED: '${LOGS_SEED:-42}'
      LOGS_ACCESS_SAMPLE: '${LOGS_ACCESS_SAMPLE:-0.05}'
      LOGS_FORCE: '${LOGS_FORCE:-0}'
    volumes:
      - .:/repo:ro
      - prometheus-data:/prometheus-history:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      prometheus-init:
        condition: service_completed_successfully

  # Restricted SQL access fixture (profile `sql`): an ITSM database whose
  # incidents and changes follow the Prometheus demo incident. See
  # docs/restricted-sql.md. The image is amd64 only (Rosetta on Apple silicon).
  mssql:
    profiles:
      - sql
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Mssql-dev1!}
    ports:
      - '${MSSQL_PORT:-1433}:1433'
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q 'SELECT 1' -b >/dev/null
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  mssql-seed:
    profiles:
      - sql
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}
    platform: linux/amd64
    entrypoint: ['/repo/demo/mssql/seed.sh']
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Mssql-dev1!}
      GRAFANA_MSSQL_PASSWORD: ${PI_MSSQL_PASSWORD:-Grafana-dev1}
      TIMELINE_FILE: /prometheus-history/demo-timeline.json
      INCIDENT_DURATION_SECONDS: '${INCIDENT_DURATION_SECONDS:-900}'
      SQL_FORCE: '${SQL_FORCE:-0}'
    volumes:
      - .:/repo:ro
      - prometheus-data:/prometheus-history:ro
    depends_on:
      mssql:
        condition: service_healthy
      prometheus-init:
        condition: service_completed_successfully

  renderer:
    image: grafana/grafana-image-renderer:${GRAFANA_IMAGE_RENDERER_VERSION:-latest}
    environment:
      ENABLE_METRICS: 'true'

volumes:
  demo-data:
  prometheus-data:
  elasticsearch-data:
  mssql-data:
